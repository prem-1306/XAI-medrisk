databases:
  - name: xaimedrisk-db
    databaseName: xaimedrisk
    user: xaiuser
    plan: free

services:
  - type: redis
    name: xaimedrisk-redis
    plan: free
    ipAllowList: [] # Secures Redis to internal network only

  - type: web
    name: xaimedrisk-api
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xaimedrisk-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: xaimedrisk-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: xaimedrisk-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # You will enter this manually in the Render dashboard

  - type: worker
    name: xaimedrisk-worker
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A app.core.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xaimedrisk-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: xaimedrisk-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: xaimedrisk-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: xaimedrisk-frontend
    env: static
    buildCommand: cd frontend-react && npm install && npm run build
    staticPublishPath: ./frontend-react/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: xaimedrisk-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
