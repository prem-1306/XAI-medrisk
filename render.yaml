databases:
  - name: xaimedrisk-db
    databaseName: xaimedrisk
    user: xaiuser
    plan: free

services:
  - type: redis
    name: xaimedrisk-redis
    plan: free
    ipAllowList: [] # Secures Redis to internal network only

  - type: web
    name: xai-clinical-api
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xaimedrisk-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: xaimedrisk-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: xaimedrisk-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false 

  - type: web
    name: xai-clinical-frontend
    env: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/out
    envVars: []
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
